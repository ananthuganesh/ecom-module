name: siyara

services:
  api:
    container_name: siyara-api
    hostname: siyara-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: siyara-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8000"
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "8000"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SHIPROCKET_EMAIL: ${SHIPROCKET_EMAIL}
      SHIPROCKET_PASSWORD: ${SHIPROCKET_PASSWORD}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      GTM_ID: ${GTM_ID:-}
      GTM_ENABLED: ${GTM_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_STUDIO_STYLE_PROMPT: ${AI_STUDIO_STYLE_PROMPT:-}
      AI_STUDIO_PROMPT: ${AI_STUDIO_PROMPT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Urban Aana <noreply@urbanaana.com>}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    volumes:
      - siyara_uploads:/app/uploads
    networks:
      - siyara-net

  web:
    container_name: siyara-web
    hostname: siyara-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GTM_ENABLED: ${NEXT_PUBLIC_GTM_ENABLED:-true}
    image: siyara-web:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      INTERNAL_BACKEND_URL: http://siyara-api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_GTM_ENABLED: ${NEXT_PUBLIC_GTM_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - siyara-net

networks:
  siyara-net:
    name: siyara-net

volumes:
  siyara_uploads:
    name: siyara_uploads
