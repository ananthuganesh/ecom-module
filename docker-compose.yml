name: urbanaana

# Tuned for a 2 vCPU / 4 GB RAM host (Mongo external via MONGO_URI).
# Budget (~3.2 GB usable after OS/Docker):
#   api  ≤ 640 MB / 0.70 CPU
#   web  ≤ 1280 MB / 0.90 CPU
# Headroom left for kernel page cache + short spikes.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    container_name: urbanaana-api
    hostname: urbanaana-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: urbanaana-api:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "8001:8000"
    environment:
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "8000"
      UVICORN_WORKERS: "1"
      UVICORN_LIMIT_CONCURRENCY: "40"
      UVICORN_TIMEOUT_KEEP_ALIVE: "5"
      MALLOC_ARENA_MAX: "2"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RAZORPAY_LIVE_API_KEY: ${RAZORPAY_LIVE_API_KEY}
      RAZORPAY_LIVE_KEY_SECRET: ${RAZORPAY_LIVE_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_KEY_PREFIX: ${R2_KEY_PREFIX:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      GTM_ID: ${GTM_ID:-}
      GTM_ENABLED: ${GTM_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      AI_STUDIO_STYLE_PROMPT: ${AI_STUDIO_STYLE_PROMPT:-}
      AI_STUDIO_PROMPT: ${AI_STUDIO_PROMPT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Urban Aana <noreply@urbanaana.com>}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-}
    volumes:
      - urbanaana_uploads:/app/uploads
    networks:
      - urbanaana-net
    mem_limit: 640m
    mem_reservation: 256m
    cpus: 0.70
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  web:
    container_name: urbanaana-web
    hostname: urbanaana-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_GTM_ENABLED: ${NEXT_PUBLIC_GTM_ENABLED:-true}
    image: urbanaana-web:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      INTERNAL_BACKEND_URL: http://urbanaana-api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      NEXT_PUBLIC_GTM_ENABLED: ${NEXT_PUBLIC_GTM_ENABLED:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: --max-old-space-size=768
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    networks:
      - urbanaana-net
    mem_limit: 1280m
    mem_reservation: 384m
    cpus: 0.90
    pids_limit: 256
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  urbanaana-net:
    name: urbanaana-net

volumes:
  urbanaana_uploads:
    name: urbanaana_uploads
